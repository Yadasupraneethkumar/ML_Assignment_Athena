<!DOCTYPE html>
<html>
<head>
    <title>Numeral System Converter</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .box {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        input, select {
            padding: 10px;
            margin: 5px;
            width: 180px;
        }
        button {
            padding: 10px 18px;
            margin-top: 8px;
            cursor: pointer;
        }
        .result-box {
            background: #eef;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<h2>🌍 Cultural Numeral System Converter</h2>

<div class="box">
    <h3>Convert</h3>
    <input id="valueInput" placeholder="Enter number">
    <br>
    <select id="src">
        <option>arabic</option>
        <option>roman</option>
        <option>chinese</option>
        <option>babylonian</option>
        <option>mayan</option>
        <option>yoruba</option>
        <option>inuktitut</option>
    </select>
    →
    <select id="dst">
        <option>roman</option>
        <option>arabic</option>
        <option>chinese</option>
        <option>babylonian</option>
        <option>mayan</option>
        <option>yoruba</option>
        <option>inuktitut</option>
    </select>
    <br>
    <button onclick="convert()">Convert</button>
    <div id="convert_result" class="result-box"></div>
</div>

<div class="box">
    <h3>Explain Conversion</h3>
    <input id="ex_value" placeholder="Enter value">
    <br>
    <select id="ex_src">
        <option>arabic</option>
        <option>roman</option>
        <option>chinese</option>
        <option>babylonian</option>
        <option>mayan</option>
        <option>yoruba</option>
        <option>inuktitut</option>
    </select>
    →
    <select id="ex_dst">
        <option>roman</option>
        <option>arabic</option>
        <option>chinese</option>
        <option>babylonian</option>
        <option>mayan</option>
        <option>yoruba</option>
        <option>inuktitut</option>
    </select>
    <br>
    <button onclick="explain()">Explain</button>
    <pre id="explain_result" class="result-box"></pre>
</div>

<div class="box">
    <h3>Puzzle</h3>
    <button onclick="getPuzzle()">New Puzzle</button>
    <p id="puzzle_question"></p>
    <input id="puzzle_answer" placeholder="Your answer">
    <button onclick="checkPuzzle()">Check</button>
    <p id="puzzle_result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
